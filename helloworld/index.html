    <!-- Apply the saved theme before the page paints, so dark mode doesn't flash light on load. -->
    <script>
        window.blogTheme = (function () {
            var STORAGE_KEY = 'theme';

            function apply(theme) {
                document.documentElement.setAttribute('data-bs-theme', theme);
                document.querySelectorAll('link[data-theme-' + theme + ']').forEach(function (link) {
                    var href = link.getAttribute('data-theme-' + theme);
                    if (link.getAttribute('href') !== href) {
                        link.setAttribute('href', href);
                    }
                });
            }

            function saved() {
                try {
                    return localStorage.getItem(STORAGE_KEY) === 'dark' ? 'dark' : 'light';
                } catch (e) {
                    return 'light';
                }
            }

            function set(theme) {
                apply(theme);
                try {
                    localStorage.setItem(STORAGE_KEY, theme);
                } catch (e) { /* storage unavailable: theme still applies for this page */ }
            }

            apply(saved());
            return { current: saved, set: set };
        })();
    </script>

<script>
moment.locale("en");
function flask_moment_render(elem) {{
    const timestamp = moment(elem.dataset.timestamp);
    const func = elem.dataset.function;
    const format = elem.dataset.format;
    const timestamp2 = elem.dataset.timestamp2;
    const no_suffix = elem.dataset.nosuffix;
    const units = elem.dataset.units;
    let args = [];
    if (format)
        args.push(format);
    if (timestamp2)
        args.push(moment(timestamp2));
    if (no_suffix)
        args.push(no_suffix);
    if (units)
        args.push(units);
    elem.textContent = timestamp[func].apply(timestamp, args);
    elem.classList.remove('flask-moment');
    elem.style.display = "";
}}
function flask_moment_render_all() {{
    const moments = document.querySelectorAll('.flask-moment');
    moments.forEach(function(moment) {{
        flask_moment_render(moment);
        const refresh = moment.dataset.refresh;
        if (refresh && refresh > 0) {{
            (function(elem, interval) {{
                setInterval(function() {{
                    flask_moment_render(elem);
                }}, interval);
            }})(moment, refresh);
        }}
    }})
}}
document.addEventListener("DOMContentLoaded", flask_moment_render_all);
</script>


    <script>
        const markdownItOptions = {
            html: false,
            xhtmlOut: true,
            breaks: true,
            linkify: true,
            typographer: true,
            highlight: function (code) {
                return window.hljs ? window.hljs.highlightAuto(code).value : code;
            }
        };
        const markdownItPlugins = {
            markdownitDeflist: {},
            markdownitFootnote: {},
            markdownitAbbr: {},
            markdownitEmoji: {},
            markdownitSub: {},
            markdownitSup: {},
            markdownitMark: {},
            markdownitIns: {},
            markdownitSmartArrows: {},
            markdownitCheckbox: {
                divWrap: true,
                divClass: 'form-check checkbox',
                idPrefix: 'cbx_'
            },
            markdownitCjkBreaks: {}
        };
        const markdownItDisabledRules = [];
        const useTwemoji = true;
        const postProcess = {
            '<table>': '<table class="table table-bordered table-striped">',
            '<pre>': '<pre class="md-codeblock">',
            '<blockquote>': '<blockquote class="blockquote md-blockquote">',
            '<input type="checkbox"': '<input type="checkbox" class="form-check-input"',
            '<label for="cbx': '<label class="form-check-label" for="cbx'
        };
        const md = window.markdownit(markdownItOptions);

        $.each(markdownItPlugins, function (plugin, opts) {
            if (window[plugin]) {
                md.use(window[plugin], opts);
                console.log("plugin used=" + plugin);
            }
        });

        const EMPTY = '';
        isEmpty = function (value, trim) {
            return value === null || value === undefined || value.length === 0 || trim && String(value).trim() === EMPTY;
        };

        if (!isEmpty(markdownItDisabledRules)) {
            md.disable(markdownItDisabledRules);
        }

        parseOutput = function (data) {
            $.each(postProcess, function (key, val) {
                if (key !== val) {
                    data = data.split(key).join(val);
                }
            });
            return data;
        };

        parserMethod = function (data) {
            md.renderer.rules.emoji = function (token, idx) {
                return useTwemoji && window.twemoji ? window.twemoji.parse(token[idx].content) :
                    '<span class="md-emoji">' + token[idx].content + '</span>';
            };

            md.renderer.rules.paragraph_open = md.renderer.rules.heading_open =
                function (tokens, idx, options, env, slf) {
                    var line;
                    if (tokens[idx].map && tokens[idx].level === 0) {
                        line = tokens[idx].map[0];
                        tokens[idx].attrJoin('class', 'md-line');
                        tokens[idx].attrSet('data-line', String(line));
                    }
                    return slf.renderToken(tokens, idx, options, env, slf);
                };
            return md.render(data);
        };

        markdownInput = "Here is my collection of hello worlds. They are all handwritten by yours truly.\n\n#### Java\n~~~java\npublic class HelloWorld {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, world!\");\n    }\n}\n~~~\n\n#### Python\n~~~python\ndef main():\n    print(\"Hello, world!\")\n\nif __name__== \"__main__\":\n  main()\n~~~\n\n#### C\n~~~c\n#include \u003cstdio.h\u003e\n\nint main() {\n    printf(\"Hello, world!\");\n    return 0;\n}\n~~~\n\n#### C++\n~~~c++\n#include \u003ciostream\u003e\n\nint main() {\n    std::cout \u003c\u003c \"Hello, world!\" \u003c\u003c std::endl;\n    return 0;\n}\n~~~\n\n#### Haskell\n~~~haskell\nputStrLn \"Hello, world!\"\n~~~\nThis is my most prized collection.";
        const result = parseOutput(parserMethod(markdownInput));
        document.getElementById('page-body').innerHTML = result;
    </script>
